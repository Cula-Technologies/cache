name: 'Cache'
description: 'Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'GitHub'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true
  key:
    description: 'An explicit key for restoring and saving the cache'
    required: true
  restore-keys:
    description: 'An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.'
    required: false
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false
  gcs-buckets:
    description: >
      Google Cloud Storage bucket(s) to use as the cache backend. May name
      several, one per line or comma separated: a restore walks them in the
      given order, while a save only ever writes the first. That lets a caller
      read from a bucket it may only read while writing solely to its own.
      Within a restore, key quality outranks bucket order — every bucket is
      tried for the primary key before any is tried for a restore-key prefix.
      Defaults to the CULA_CACHE_GCS_BUCKET or CONFIGURED_GCS_BUCKET
      environment variable when omitted.
    required: false
  gcs-bucket:
    description: >
      Deprecated alias of gcs-buckets, still read for callers not yet updated.
    required: false
    deprecationMessage: |
      gcs-bucket is deprecated; use gcs-buckets, which accepts one name or
      several. Behaviour is unchanged for a single bucket.
  gcs-path-prefix:
    description: 'Optional prefix path within the GCS bucket for cache files'
    required: false
    default: 'github-cache'
  wif-provider:
    description: >
      Optional Workload Identity Federation provider resource name, e.g.
      projects/123/locations/global/workloadIdentityPools/pool/providers/gh.
      When set together with service-account, this run's OIDC token is
      exchanged for that service account and the GCS bucket is read and
      written as it, instead of as the runner's ambient credentials. The job
      must grant `permissions: id-token: write`.
    required: false
  service-account:
    description: >
      Service account to impersonate through wif-provider. Required when
      wif-provider is set, and ignored without it.
    required: false
  fallback-to-github:
    description: >
      Whether to save to the GitHub Actions cache when the GCS save fails.
      Defaults to true, which is the actions/cache behaviour. Set false when
      the point of the step is to land in one specific bucket: a fallback
      would otherwise report success from the wrong destination, and the entry
      it writes gets served from GitHub by later restores so GCS never
      receives the key.
    required: false
    default: 'true'
  save-always:
    description: 'Run the post step to save the cache even if another step before fails'
    default: 'false'
    required: false
    deprecationMessage: |
      save-always does not work as intended and will be removed in a future release.
      A separate `actions/cache/restore` step should be used instead.
      See https://github.com/actions/cache/tree/main/save#always-save-cache for more details.
outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
runs:
  using: 'node24'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: "success()"
branding:
  icon: 'archive'
  color: 'gray-dark'
