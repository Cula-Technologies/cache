name: 'Restore Cache'
description: 'Restore Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'GitHub'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to restore'
    required: true
  key:
    description: 'An explicit key for restoring the cache'
    required: true
  restore-keys:
    description: 'An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to restore caches that were saved on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false
  gcs-buckets:
    description: >
      Google Cloud Storage bucket(s) to use as the cache backend. May name
      several, one per line or comma separated: a restore walks them in the
      given order, while a save only ever writes the first. Within a restore,
      key quality outranks bucket order — every bucket is tried for the
      primary key before any is tried for a restore-key prefix.

      Optional. With the CULA_PIPELINE_* environment set, this run's trust
      tier supplies the buckets instead: own tier first, then the tiers it may
      read. Failing both, CULA_CACHE_GCS_BUCKET or CONFIGURED_GCS_BUCKET.
      There is no GitHub Actions cache fallback — if no bucket can be
      resolved, the step fails.
    required: false
  gcs-bucket:
    description: >
      Deprecated alias of gcs-buckets, still read for callers not yet updated.
    required: false
    deprecationMessage: |
      gcs-bucket is deprecated; use gcs-buckets, which accepts one name or
      several. Behaviour is unchanged for a single bucket.
  gcs-path-prefix:
    description: 'Optional prefix path within the GCS bucket for cache files'
    default: 'github-cache'
    required: false
  wif-provider:
    description: >
      Optional Workload Identity Federation provider resource name. With
      service-account, this run's OIDC token is exchanged for that account and
      the bucket is read and written as it, rather than as the runner's
      ambient credentials. Both are derived from the CULA_PIPELINE_*
      environment when omitted, so a wired-up workflow needs neither. The job
      must grant `permissions: id-token: write`.
    required: false
  service-account:
    description: >
      Service account to impersonate through wif-provider. Derived from the
      CULA_PIPELINE_* environment and this run's trust tier when omitted.
    required: false
outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
  cache-primary-key:
    description: 'A resolved cache key for which cache match was attempted'
  cache-matched-key:
    description: 'Key of the cache that was restored, it could either be the primary key on cache-hit or a partial/complete match of one of the restore keys'
runs:
  using: 'node24'
  main: '../dist/restore-only/index.js'
branding:
  icon: 'archive'
  color: 'gray-dark'
